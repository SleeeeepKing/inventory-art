services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory_art}
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory_dev_password}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    networks:
      default:
        aliases: [minio.localhost]
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:-minioadmin}
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [minio_data:/data]
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command:
      [
        "until mc alias set local http://minio:9000 $${R2_ACCESS_KEY_ID:-minioadmin} $${R2_SECRET_ACCESS_KEY:-minioadmin}; do sleep 2; done; mc mb --ignore-existing local/$${R2_BUCKET_PRIVATE:-inventory-art}",
      ]
  backend:
    build: ./backend
    mem_limit: ${BACKEND_MEMORY_LIMIT:-512m}
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-inventory_art}
      DATABASE_USERNAME: ${POSTGRES_USER:-inventory}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-inventory_dev_password}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-1234567890}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}
      COOKIE_SECURE: "false"
      STORAGE_PROVIDER: minio
      R2_ENDPOINT: http://minio.localhost:9000
      R2_PUBLIC_ENDPOINT: ${R2_PUBLIC_ENDPOINT:-http://minio.localhost:9000}
      R2_REGION: us-east-1
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-minioadmin}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-minioadmin}
      R2_BUCKET_PRIVATE: ${R2_BUCKET_PRIVATE:-inventory-art}
    ports: ["${BACKEND_PORT:-8080}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
  frontend:
    build:
      context: ./frontend
      args:
        {
          VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8080/api/v1}",
        }
    ports: ["${FRONTEND_PORT:-4173}:8080"]
    depends_on: [backend]
volumes:
  postgres_data:
  minio_data:
