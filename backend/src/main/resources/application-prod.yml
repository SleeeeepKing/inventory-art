server:
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:16}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:2}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:128}
    accept-count: ${TOMCAT_ACCEPT_COUNT:32}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:10s}
    keep-alive-timeout: ${TOMCAT_KEEP_ALIVE_TIMEOUT:20s}
    max-keep-alive-requests: ${TOMCAT_MAX_KEEP_ALIVE_REQUESTS:100}
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:3}
      minimum-idle: ${DATABASE_MIN_IDLE:0}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DATABASE_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DATABASE_MAX_LIFETIME_MS:900000}
      data-source-properties:
        sslmode: require
  jpa:
    hibernate:
      ddl-auto: validate
app:
  security:
    cookie-secure: true
    cookie-same-site: ${COOKIE_SAME_SITE:None}
  storage:
    provider: r2
  seed:
    enabled: false
