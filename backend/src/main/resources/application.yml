server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: inventory-art
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/inventory_art}
    username: ${DATABASE_USERNAME:inventory}
    password: ${DATABASE_PASSWORD:inventory_dev_password}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:3}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: ${JPA_BATCH_SIZE:200}
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${IMPORT_MAX_FILE_SIZE:20MB}
      max-request-size: ${IMPORT_MAX_FILE_SIZE:20MB}
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-1234567890}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
    cookie-secure: ${COOKIE_SECURE:false}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-path: ${LOCAL_STORAGE_PATH:./storage-data}
    endpoint: ${R2_ENDPOINT:}
    public-endpoint: ${R2_PUBLIC_ENDPOINT:}
    region: ${R2_REGION:auto}
    access-key: ${R2_ACCESS_KEY_ID:}
    secret-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET_PRIVATE:inventory-art}
    presigned-expiration-seconds: ${R2_PRESIGNED_URL_EXPIRATION_SECONDS:900}
  import-config:
    max-file-size: ${IMPORT_MAX_BYTES:20971520}
    legacy-spreadsheet-max-file-size: ${IMPORT_XLS_MAX_BYTES:5242880}
    batch-size: ${IMPORT_BATCH_SIZE:200}
    max-rows: ${IMPORT_MAX_ROWS:20000}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
